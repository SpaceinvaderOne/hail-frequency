# HailFrequency behind a Tailscale sidecar: the app shares the sidecar's
# network namespace, so the only way in is the sidecar's https address on
# your tailnet. No port is published on the host. serve.json tells the
# sidecar to terminate HTTPS on 443 and hand requests to the app on 8069.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: hailfrequency-ts
    hostname: hail
    environment:
      - TS_AUTHKEY=tskey-auth-<your key>
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  hailfrequency:
    image: ghcr.io/spaceinvaderone/hailfrequency:latest
    container_name: hailfrequency
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      # The entrypoint sets this folder's owner to PUID:PGID on every start.
      - ./config:/app/config
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
